name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/loopback-anywhere-zh
    paths:
      - 'ios-app/**'
      - 'rust-core/**'
      - 'project.yml'
      - 'build-rust.sh'
      - '.github/workflows/build-unsigned-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: '17.4'
      SCHEME: SideInstaller
      PROJECT: SideInstaller.xcodeproj
      BUILD_DIR: ${{ github.workspace }}/build
      APP_DIR: ${{ github.workspace }}/build/Build/Products/Release-iphoneos
      RELEASE_TAG: unsigned-ipa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Install xcpretty
        run: |
          gem install xcpretty --no-document

      - name: Install Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build Rust xcframework
        run: |
          chmod +x ./build-rust.sh
          ./build-rust.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhoneOS app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find "$APP_DIR" -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          PKG="$BUILD_DIR/unsigned-package"
          rm -rf "$PKG"
          mkdir -p "$PKG/Payload"
          cp -R "$APP" "$PKG/Payload/"
          cd "$PKG"
          /usr/bin/zip -qry "$BUILD_DIR/SideInstaller-unsigned.ipa" Payload
          test -f "$BUILD_DIR/SideInstaller-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-unsigned-ipa
          path: ${{ env.BUILD_DIR }}/SideInstaller-unsigned.ipa

      - name: Upsert unsigned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SideInstaller unsigned IPA
          prerelease: true
          files: ${{ env.BUILD_DIR }}/SideInstaller-unsigned.ipa
          make_latest: false
