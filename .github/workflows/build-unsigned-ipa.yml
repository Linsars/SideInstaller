name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/loopback-anywhere-zh
    paths:
      - 'ios-app/**'
      - 'rust-core/**'
      - 'project.yml'
      - 'build-rust.sh'
      - '.github/workflows/build-unsigned-ipa.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      IPHONEOS_DEPLOYMENT_TARGET: '17.4'
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.frizzle.sideinstaller
      SCHEME: SideInstaller
      PROJECT: SideInstaller.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/SideInstaller.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      RELEASE_TAG: unsigned-ipa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build Rust xcframework
        run: |
          chmod +x ./build-rust.sh
          ./build-rust.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Patch team in project.yml if provided
        if: ${{ env.TEAM_ID != '' }}
        run: |
          /usr/bin/python3 - <<'PY'
from pathlib import Path
p = Path('project.yml')
s = p.read_text()
s = s.replace('DEVELOPMENT_TEAM: ""', 'DEVELOPMENT_TEAM: "${{ secrets.APPLE_TEAM_ID }}"')
p.write_text(s)
PY
          xcodegen generate

      - name: Import signing assets
        if: ${{ secrets.BUILD_CERT_BASE64 != '' && secrets.BUILD_PROFILE_BASE64 != '' }}
        env:
          BUILD_CERT_BASE64: ${{ secrets.BUILD_CERT_BASE64 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          BUILD_PROFILE_BASE64: ${{ secrets.BUILD_PROFILE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$BUILD_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/cert.p12"
          echo "$BUILD_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/profile.mobileprovision"
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import "$RUNNER_TEMP/signing/cert.p12" -k build.keychain -P "$BUILD_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/signing/profile.mobileprovision")")
          cp "$RUNNER_TEMP/signing/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Archive app
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$ARCHIVE_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Create export options plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>destination</key><string>export</string>
          <key>method</key><string>development</string>
          <key>signingStyle</key><string>automatic</string>
          <key>stripSwiftSymbols</key><true/>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          EOF

      - name: Export IPA
        run: |
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            | xcpretty || exit ${PIPESTATUS[0]}

      - name: Rename IPA
        run: |
          IPA=$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA"
          cp "$IPA" "$EXPORT_PATH/SideInstaller-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-unsigned-ipa
          path: ${{ env.EXPORT_PATH }}/SideInstaller-unsigned.ipa

      - name: Upsert unsigned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SideInstaller unsigned IPA
          prerelease: true
          files: ${{ env.EXPORT_PATH }}/SideInstaller-unsigned.ipa
          make_latest: false
